name: Find reCAPTCHA Dependency

on:
  workflow_dispatch:

jobs:
  check-recaptcha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Gradle 8.2.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
          unzip -q gradle-8.2.2-bin.zip
          echo "$PWD/gradle-8.2.2/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Find reCAPTCHA dependency
        run: |
          cd android

          echo "======================================"
          echo "   RUNNING GRADLE DEPENDENCY CHECK"
          echo "======================================"

          gradle app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > ../dependencies.txt

          cd ..

          echo ""
          echo "======================================"
          echo "   reCAPTCHA DEPENDENCY"
          echo "======================================"

          grep -i -B 15 -A 15 \
            "com.google.android.recaptcha:recaptcha" \
            dependencies.txt || true

      - name: Search all reCAPTCHA references
        run: |
          echo "======================================"
          echo "   ALL reCAPTCHA REFERENCES"
          echo "======================================"

          grep -i -n \
            "recaptcha" \
            dependencies.txt || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: recaptcha-dependency-report
          path: dependencies.txt
