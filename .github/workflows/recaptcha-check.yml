name: Find reCAPTCHA Dependency

on:
  workflow_dispatch:

jobs:
  check-recaptcha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      # Gradle को wrapper से डाउनलोड नहीं करेंगे
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.2"

      - name: Check Gradle
        run: |
          gradle --version

      # Android dependencies की पूरी जांच
      - name: Find reCAPTCHA Dependency
        run: |
          echo "=============================================="
          echo "CHECKING reCAPTCHA DEPENDENCY"
          echo "=============================================="

          gradle -p android app:dependencies \
            --configuration releaseRuntimeClasspath \
            > dependencies.txt

          echo ""
          echo "=============================================="
          echo "reCAPTCHA RESULT"
          echo "=============================================="

          grep -i -B 15 -A 15 \
            "com.google.android.recaptcha:recaptcha" \
            dependencies.txt || true

      # पूरे project में reCAPTCHA के references खोजें
      - name: Search all reCAPTCHA references
        run: |
          echo "=============================================="
          echo "SEARCHING PROJECT"
          echo "=============================================="

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.dart_tool \
            --exclude-dir=build \
            "recaptcha" . || true

      # Firebase/Auth dependency information भी निकालें
      - name: Search Firebase Auth dependencies
        run: |
          echo "=============================================="
          echo "FIREBASE AUTH DEPENDENCIES"
          echo "=============================================="

          grep -i -B 10 -A 20 \
            "firebase-auth" \
            dependencies.txt || true

      # Report save करें
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: recaptcha-dependency-report
          path: dependencies.txt
