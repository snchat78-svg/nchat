name: Find reCAPTCHA Dependency

on:
  workflow_dispatch:

jobs:
  check-recaptcha:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      # =========================================================
      # 4. Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable

      # =========================================================
      # 5. Flutter dependencies
      # =========================================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # =========================================================
      # 6. TEMPORARY KEYSTORE
      # =========================================================
      - name: Create temporary diagnostic keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/diagnostic-key.jks \
            -alias diagnostic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass diagnostic123 \
            -keypass diagnostic123 \
            -dname "CN=Diagnostic, OU=Test, O=Test, L=Test, ST=Test, C=IN"

      # =========================================================
      # 7. Temporary key.properties
      # =========================================================
      - name: Create temporary key.properties
        run: |
          cat > android/app/key.properties <<'EOF'
          storePassword=diagnostic123
          keyPassword=diagnostic123
          keyAlias=diagnostic
          storeFile=diagnostic-key.jks
          EOF

      # =========================================================
      # 8. Setup Gradle 8.5
      # =========================================================
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # =========================================================
      # 9. Check Gradle
      # =========================================================
      - name: Check Gradle
        run: |
          gradle --version

      # =========================================================
      # 10. Resolve Android dependencies
      # =========================================================
      - name: Resolve Android dependencies
        run: |
          gradle -p android \
            app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > dependencies.txt

      # =========================================================
      # 11. Exact reCAPTCHA dependency path
      # =========================================================
      - name: Find exact reCAPTCHA dependency path
        run: |
          echo ""
          echo "======================================================"
          echo " EXACT reCAPTCHA DEPENDENCY PATH"
          echo "======================================================"

          gradle -p android \
            app:dependencyInsight \
            --dependency com.google.android.recaptcha:recaptcha \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > recaptcha-insight.txt || true

          cat recaptcha-insight.txt

      # =========================================================
      # 12. Search specifically for version 18.1.2
      # =========================================================
      - name: Find reCAPTCHA 18.1.2
        run: |
          echo ""
          echo "======================================================"
          echo " SEARCHING FOR reCAPTCHA 18.1.2"
          echo "======================================================"

          grep -n -B 20 -A 20 \
            "com.google.android.recaptcha:recaptcha:18.1.2" \
            dependencies.txt \
            recaptcha-insight.txt || true

      # =========================================================
      # 13. NEW:
      #     Check Gradle cache for actual reCAPTCHA artifacts
      # =========================================================
      - name: Check resolved reCAPTCHA artifacts
        run: |
          echo ""
          echo "======================================================"
          echo " RESOLVED reCAPTCHA ARTIFACTS IN GRADLE CACHE"
          echo "======================================================"

          find ~/.gradle/caches/modules-2/files-2.1/com.google.android.recaptcha \
            -maxdepth 5 \
            -type f \
            2>/dev/null | sort || true

          echo ""
          echo "======================================================"
          echo " PROJECT reCAPTCHA AAR/JAR FILES"
          echo "======================================================"

          find . \
            -type f \
            \( -name "*recaptcha*.aar" -o -name "*recaptcha*.jar" \) \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            2>/dev/null | sort || true

      # =========================================================
      # 14. NEW:
      #     Print exact versions found anywhere in Gradle cache
      # =========================================================
      - name: List all cached reCAPTCHA versions
        run: |
          echo ""
          echo "======================================================"
          echo " ALL CACHED reCAPTCHA VERSIONS"
          echo "======================================================"

          find ~/.gradle/caches/modules-2/files-2.1/com.google.android.recaptcha \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" \
            2>/dev/null | sort -V || true

      # =========================================================
      # 15. Search all reCAPTCHA references
      # =========================================================
      - name: Search all reCAPTCHA references
        run: |
          echo ""
          echo "======================================================"
          echo " ALL reCAPTCHA REFERENCES"
          echo "======================================================"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.dart_tool \
            --exclude-dir=build \
            --exclude="diagnostic-key.jks" \
            "recaptcha" . || true

      # =========================================================
      # 16. Firebase Auth dependency path
      # =========================================================
      - name: Find Firebase Auth dependency path
        run: |
          echo ""
          echo "======================================================"
          echo " FIREBASE AUTH DEPENDENCY"
          echo "======================================================"

          gradle -p android \
            app:dependencyInsight \
            --dependency com.google.firebase:firebase-auth \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > firebase-auth-insight.txt || true

          cat firebase-auth-insight.txt

      # =========================================================
      # 17. Search Firebase Auth in full dependency tree
      # =========================================================
      - name: Search Firebase Auth in dependency tree
        run: |
          echo ""
          echo "======================================================"
          echo " FIREBASE AUTH REFERENCES"
          echo "======================================================"

          grep -i -B 15 -A 20 \
            "firebase-auth" \
            dependencies.txt || true

      # =========================================================
      # 18. NEW:
      #     Check Gradle resolution result for BOTH versions
      # =========================================================
      - name: Compare reCAPTCHA versions
        run: |
          echo ""
          echo "======================================================"
          echo " reCAPTCHA VERSION COMPARISON"
          echo "======================================================"

          echo ""
          echo "--- 18.1.2 references ---"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.dart_tool \
            --exclude-dir=build \
            "18.1.2" . || true

          echo ""
          echo "--- 18.4.0 references ---"
          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.dart_tool \
            --exclude-dir=build \
            "18.4.0" . || true

      # =========================================================
      # 19. Save reports
      # =========================================================
      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: recaptcha-diagnostic-report
          path: |
            dependencies.txt
            recaptcha-insight.txt
            firebase-auth-insight.txt
