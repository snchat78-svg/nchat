name: nchat_fix
description: Firebase-enabled chat app
publish_to: "none"
version: 1.0.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"  # ? Dart 3.0.5 compatible

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # ? Firebase Packages (Safe for Dart 3.0.5)
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  firebase_storage: ^11.7.7
  uuid: 4.2.2

  # ? Other Stable Plugins
  google_maps_flutter: ^2.5.3
  geolocator: ^11.1.0
  image_picker: ^1.0.7
  emoji_picker_flutter: 1.6.4
  http: ^1.2.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.4
  share_plus: ^7.2.2
  intl: ^0.20.2
  url_launcher: ^6.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1   # ? Icon setup dependency

flutter:
  uses-material-design: true

  assets:
    - assets/icons/   # ? Correct & enough

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
